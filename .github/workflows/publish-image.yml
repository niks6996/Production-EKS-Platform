name: Publish application image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-platform-api
  cancel-in-progress: false

jobs:
  publish:
    name: Test, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run application tests
        working-directory: apps/platform-api
        run: python -m unittest -v

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: github-ecr-publish

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build immutable image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: production-eks-platform-dev-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}" \
            apps/platform-api

      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/production-eks-platform-dev-app:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: production-eks-platform-dev-app
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

      - name: Record published image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: production-eks-platform-dev-app
          IMAGE_TAG: ${{ github.sha }}
        run: echo "Published ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}" >> "${GITHUB_STEP_SUMMARY}"