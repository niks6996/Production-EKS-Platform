name: Helm validation

on:
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm-validate.yml"
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/helm-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Display Helm version
        run: helm version --short

      - name: Lint chart
        run: helm lint helm/platform-api --strict

      - name: Render default manifests
        run: |
          helm template platform-api helm/platform-api \
            --namespace platform \
            --set image.repository=local/platform-api \
            --set image.tag=ci \
            > /tmp/platform-api-default.yaml

      - name: Render optional resources
        run: |
          helm template platform-api helm/platform-api \
            --namespace platform \
            --set image.repository=local/platform-api \
            --set image.tag=ci \
            --set autoscaling.enabled=true \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            > /tmp/platform-api-complete.yaml

      - name: Render development ALB ingress
        run: |
          helm template platform-api helm/platform-api \
            --namespace platform \
            --values helm/platform-api/values-dev.yaml \
            --set image.repository=local/platform-api \
            --set image.tag=ci \
            > /tmp/platform-api-development.yaml

      - name: Confirm rendered resources
        run: |
          grep -q "kind: Deployment" /tmp/platform-api-default.yaml
          grep -q "kind: Service" /tmp/platform-api-default.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/platform-api-complete.yaml
          grep -q "kind: Ingress" /tmp/platform-api-complete.yaml
          grep -q "kind: ServiceMonitor" /tmp/platform-api-complete.yaml
          grep -q "alb.ingress.kubernetes.io/scheme: internet-facing" /tmp/platform-api-development.yaml
          grep -q "alb.ingress.kubernetes.io/target-type: ip" /tmp/platform-api-development.yaml