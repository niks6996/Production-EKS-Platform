name: Terraform validation

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Display Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive terraform

      - name: Initialise and validate Terraform root modules
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t root_modules < <(
            find terraform -type f -name "*.tf" -printf '%h\n' | sort -u
          )

          if (( ${#root_modules[@]} == 0 )); then
            echo "No Terraform root modules were found."
            exit 1
          fi

          for module in "${root_modules[@]}"; do
            echo "Validating ${module}"
            terraform -chdir="${module}" init -backend=false -input=false
            terraform -chdir="${module}" validate
          done