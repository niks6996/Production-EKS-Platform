apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: production-eks-platform
data:
  platform-api.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(rate(platform_api_http_requests_total[5m]))",
              "legendFormat": "requests",
              "refId": "A"
            }
          ],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}},
          "targets": [
            {
              "expr": "max(platform_api_uptime_seconds)",
              "legendFormat": "uptime",
              "refId": "A"
            }
          ],
          "title": "Application uptime",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"platform\",container=\"platform-api\"}[5m])) / sum(kube_pod_container_resource_limits{namespace=\"platform\",container=\"platform-api\",resource=\"cpu\"})",
              "legendFormat": "CPU limit utilisation",
              "refId": "A"
            }
          ],
          "title": "CPU utilisation",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"platform\",container=\"platform-api\"})",
              "legendFormat": "working set",
              "refId": "A"
            }
          ],
          "title": "Memory working set",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["eks", "platform-api"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Platform API",
      "uid": "platform-api",
      "version": 1
    }