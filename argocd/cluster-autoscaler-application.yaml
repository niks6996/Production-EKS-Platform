apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
spec:
  project: production-eks-platform
  source:
    repoURL: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    targetRevision: "9.59.0"
    helm:
      releaseName: cluster-autoscaler
      values: |
        cloudProvider: aws
        awsRegion: eu-west-2

        autoDiscovery:
          clusterName: production-eks-platform-dev-cluster

        image:
          tag: v1.35.0

        rbac:
          serviceAccount:
            create: true
            name: cluster-autoscaler-aws-cluster-autoscaler

        resources:
          requests:
            cpu: 100m
            memory: 300Mi
          limits:
            cpu: 200m
            memory: 600Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false